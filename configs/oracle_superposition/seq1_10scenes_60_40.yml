EXPERIMENT:
  NAME: oracle_superposition_seq1_10scenes_60_40_zero_random
  BASE_CONFIG: ./configs/ASF_v2_0_seq1_psp.yml
  RESULT_ROOT: ./results/OracleSuperposition/10scenes_seq1_60_40

BASE:
  NAME: seq1
  SEQUENCE: "1"
  CHECKPOINT_LOAD_POLICY: compatible_base_context

# Seq58 remains first for direct comparison with the historical Seq1 -> Seq58
# experiment. Every target context starts with deterministic PSP signs and zero
# scene-specific residuals; no residual is inherited from an earlier scene.
SCENES:
  - NAME: seq58
    SEQUENCE: "58"
  - NAME: seq5
    SEQUENCE: "5"
  - NAME: seq22
    SEQUENCE: "22"
  - NAME: seq34
    SEQUENCE: "34"
  - NAME: seq9
    SEQUENCE: "9"
  - NAME: seq38
    SEQUENCE: "38"
  - NAME: seq35
    SEQUENCE: "35"
  - NAME: seq46
    SEQUENCE: "46"
  - NAME: seq19
    SEQUENCE: "19"

DATA:
  ONLINE_BATCH_SIZE: 1
  NUM_WORKERS: 0
  LIST_DIR_KRADAR:
    - /home/code/hyperradar/dataset/k_radar
  TRAIN_SPLIT: ./resources/split/time_10scenes_60_40/train.txt
  TEST_SPLIT: ./resources/split/time_10scenes_60_40/test.txt

ONLINE:
  CONTEXT_INITIALIZATION: zero_random
  TRAINABLE_SCOPE: fuser_head
  OPTIMIZER: adamw
  LR: 0.0001
  WEIGHT_DECAY: 0.0
  MOMENTUM: 0.9
  GRAD_CLIP: 0.0
  MAX_STEPS_PER_SCENE: -1
  STAGE_SELECTION: best

EVALUATION:
  CONF_THR: 0.3
  BEST_METRIC_CLS: auto
  BEST_METRIC_KIND: 3d
  BEST_METRIC_IOUS: [0.3, 0.5]
  SCENE_PRE_EVAL: true
  EVAL_EVERY_UPDATES: 50
  SCENE_FINAL_EVAL: true
  BACKTEST_POLICY: final

AUDIT:
  ENABLED: true
  STRICT: true
  ATOL: 0.0
  INHERITANCE_ATOL: 1.0e-6
  CHECK_BUFFERS: true
  REQUIRE_SCENE_WEIGHT_BANK: true
  MIN_ACTIVE_PARAMETER_NUMEL: 1000000
