EXPERIMENT:
  NAME: oracle_superposition_seq5_10scenes
  BASE_CONFIG: ./configs/ASF_v2_0_seq5_psp.yml
  RESULT_ROOT: ./results/OracleSuperposition/10scenes_seq5

BASE:
  NAME: seq5
  SEQUENCE: "5"

SCENES:
  - NAME: seq1
    SEQUENCE: "1"
  - NAME: seq22
    SEQUENCE: "22"
  - NAME: seq34
    SEQUENCE: "34"
  - NAME: seq9
    SEQUENCE: "9"
  - NAME: seq38
    SEQUENCE: "38"
  - NAME: seq35
    SEQUENCE: "35"
  - NAME: seq46
    SEQUENCE: "46"
  - NAME: seq58
    SEQUENCE: "58"
  - NAME: seq19
    SEQUENCE: "19"

DATA:
  ONLINE_BATCH_SIZE: 1
  NUM_WORKERS: 0

ONLINE:
  CONTEXT_INITIALIZATION: inherit_previous
  TRAINABLE_SCOPE: fuser_head
  OPTIMIZER: adamw
  LR: 0.0001
  WEIGHT_DECAY: 0.0
  MOMENTUM: 0.9
  GRAD_CLIP: 0.0
  MAX_STEPS_PER_SCENE: -1

EVALUATION:
  CONF_THR: 0.3
  BEST_METRIC_CLS: auto
  BEST_METRIC_KIND: 3d
  BEST_METRIC_IOUS: [0.3, 0.5]
  SCENE_PRE_EVAL: true
  EVAL_EVERY_UPDATES: 50
  SCENE_FINAL_EVAL: true
  BACKTEST_POLICY: final


AUDIT:
  ENABLED: true
  STRICT: true
  ATOL: 0.0
  INHERITANCE_ATOL: 1.0e-6
  CHECK_BUFFERS: true
